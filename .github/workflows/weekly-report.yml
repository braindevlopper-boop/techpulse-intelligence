name: TechPulse Weekly Report

on:
  workflow_dispatch: {}

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate weekly podcast
        env:
          TECHPULSE_WORKER_URL: ${{ secrets.TECHPULSE_WORKER_URL }}
          TECHPULSE_WORKER_SECRET: ${{ secrets.TECHPULSE_WORKER_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          FIREBASE_SERVER_KEY: ${{ secrets.FIREBASE_SERVER_KEY }}
        run: |
          python -c "
          from pipeline.podcast_generator import generate_podcast
          from pipeline.notifier import send_fcm_notification

          # podcast_generator is disabled after the D1 migration (no D1 route
          # for podcasts/serendipity scoring) — this now logs a warning and
          # no-ops. Kept as a workflow so re-enabling later is a one-file change.
          pid = generate_podcast(None, podcast_type='weekly')
          if pid:
              send_fcm_notification(
                  'TechPulse — Résumé de la semaine',
                  'Ton podcast hebdo est prêt',
                  {'type': 'weekly_podcast'}
              )
          "
