name: TechPulse Intelligence

on:
  repository_dispatch:
    types: [ingest_complete]
  schedule:
    - cron: '0 7,13,19 * * *'    # Fallback: 1h after ingest
    - cron: '43 16 * * *'        # Temporary test: 18:43 CEST / 16:43 UTC
    - cron: '30 7 * * *'         # 09:30 Paris (CEST) — run de test
  workflow_dispatch:
    inputs:
      recluster_all:
        description: 'Rebuild all clusters from existing 1024-dim embeddings'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      same_theme_threshold:
        description: 'BGE-M3 clustering threshold for same theme'
        required: false
        default: '0.68'
        type: string
      article_llm_limit:
        description: 'Max articles to enrich with Article Intelligence in this run'
        required: false
        default: '60'
        type: string
      force_llm_analysis:
        description: 'Regenerate cluster LLM analyses even if they were analyzed recently'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      skip_hf_ml:
        description: 'Skip Hugging Face NER/classification/keywords/sentiment steps'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      refresh_hf_cache:
        description: 'Download missing Hugging Face models and upload them to R2 cache'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: techpulse-intelligence
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      HF_HUB_DISABLE_PROGRESS_BARS: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-v1-${{ runner.os }}
          restore-keys: |
            hf-models-v1-

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Preload Hugging Face models
        if: ${{ (github.event.inputs.recluster_all || 'false') != 'true' && (github.event.inputs.skip_hf_ml || 'true') != 'true' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_OFFLINE: ${{ (github.event.inputs.refresh_hf_cache || 'false') == 'true' && '0' || '1' }}
          TECHPULSE_HF_DOWNLOAD_MISSING: ${{ (github.event.inputs.refresh_hf_cache || 'false') == 'true' && 'true' || 'false' }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          HF_R2_BUCKET: ${{ secrets.R2_BUCKET }}
          HF_R2_PREFIX: hf-model-cache/v1
        run: python -m pipeline.hf_preload

      - name: Run intelligence pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL_PREMIUM: ${{ vars.OPENROUTER_MODEL_PREMIUM }}
          OPENROUTER_MODEL_TAIL: ${{ vars.OPENROUTER_MODEL_TAIL }}
          OPENROUTER_PREMIUM_TOP_N: ${{ vars.OPENROUTER_PREMIUM_TOP_N }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          FIREBASE_SERVER_KEY: ${{ secrets.FIREBASE_SERVER_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_OFFLINE: "1"
          TECHPULSE_RECLUSTER_ALL: ${{ github.event.inputs.recluster_all || 'false' }}
          TECHPULSE_SKIP_HF_ML: ${{ ((github.event.inputs.skip_hf_ml || 'true') == 'true' || (github.event.inputs.recluster_all || 'false') == 'true') && 'true' || 'false' }}
          TECHPULSE_ALLOW_HF_FAILURE: "true"
          TECHPULSE_SKIP_LEGACY_PODCAST: "true"
          TECHPULSE_ARTICLE_LLM_LIMIT: ${{ github.event.inputs.article_llm_limit || '60' }}
          TECHPULSE_FORCE_LLM_ANALYSIS: ${{ github.event.inputs.force_llm_analysis || 'false' }}
          TECHPULSE_SAME_THEME_THRESHOLD: ${{ github.event.inputs.same_theme_threshold || '0.68' }}
          TECHPULSE_SAME_EVENT_THRESHOLD: "0.84"
        run: python -m pipeline

      - name: Dispatch signal push notifications
        if: ${{ success() }}
        continue-on-error: true
        env:
          WORKER_URL: ${{ secrets.TECHPULSE_WORKER_URL }}
          WORKER_API_SECRET: ${{ secrets.TECHPULSE_WORKER_SECRET }}
        run: |
          if [ -z "$WORKER_URL" ] || [ -z "$WORKER_API_SECRET" ]; then
            echo "WORKER_URL or WORKER_API_SECRET not set — skipping signal push dispatch"
            exit 0
          fi
          echo "Dispatching signal push alerts to Worker..."
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "${WORKER_URL}/push/signals/dispatch" \
            -H "Authorization: Bearer ${WORKER_API_SECRET}" \
            -H "Content-Type: application/json" \
            --max-time 30)
          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -n -1)
          echo "HTTP $http_code"
          echo "Response: $body"
          if [ "$http_code" != "200" ]; then
            echo "Warning: signal dispatch returned non-200, but continuing (continue-on-error)"
          fi
